<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Index pagina</title>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-success">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Menu principal</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="clientes.html">Clientes</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <br>

      <!-- Boton de añadir clientes -->
      <button type="button" class="btn btn-primary text-center" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@mdo">Gestion de Clientes</button>
      <br>
      
      <!-- Parte superior del modall -->
       <!-- id -->
      <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
                <!-- id -->
              <h1 class="modal-title fs-5" id="exampleModalLabel">Agrega clientes</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <!-- Campos del modal  -->

                <!-- Campo: Email -->
                <div class="mb-3">
                    <!-- id: txtEmail -->
                  <label for="txtEmail" class="col-form-label">Email:</label>
                  <input type="email" class="form-control" id="txtEmail" placeholder="Ingrese su correo electronico: " required>
                </div>

                <!-- Campo: Nombre -->
                <div class="mb-3">
                    <!-- id: txtNombre -->
                  <label for="txtNombre" class="col-form-label">Nombre:</label>
                  <input type="text" class="form-control" id="txtNombre" placeholder="Ingrese su nombre: " required>
                </div>

                <!-- Campo: Apellido -->
                <div class="mb-3">
                    <!-- id: txtApellido -->
                  <label for="txtApellido" class="col-form-label">Apelldio:</label>
                  <input type="text" class="form-control" id="txtApellido" placeholder="Ingrese su Apelldio: " required>
                </div>

                <!-- Campo: Telefono -->
                <div class="mb-3">
                    <!-- id: txtApellido -->
                  <label for="txtApellido" class="col-form-label">Telefono:</label>
                  <input type="number" class="form-control" id="txtApellido" placeholder="Ingrese su Telefono: " required>
                </div>
              </form>
            </div>


            

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
              <!-- id:  -->
              <button id="btnAgregarCliente" type="button" class="btn btn-primary">Agregar cliente</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de html -->
       <main class=".col-md-4">
      <table class="table">
        <thead class="text-center">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Email</th>
            <th scope="col">Nombre</th>
            <th scope="col">Apellido</th>
            <th scope="col">Telefono</th>
          </tr>
        </thead>
        <tbody id="tbIndex">
          <!-- Aqui se inserta los datos de js -->
        </tbody>
      </table>
    </main>

    <!-- Boostrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./js/controllers/indexController.js"></script>
</body>
</html>
